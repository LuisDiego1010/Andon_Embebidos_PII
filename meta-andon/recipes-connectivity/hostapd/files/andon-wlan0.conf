# hostapd espera a que exista wlan0 (el firmware tarda unos segundos al arrancar), desbloquea la
# Wi-Fi por si quedó bloqueada y se reintenta si falla.
[Unit]
BindsTo=sys-subsystem-net-devices-wlan0.device
After=sys-subsystem-net-devices-wlan0.device

[Service]
ExecStartPre=-/bin/sh -c 'rfkill unblock wlan'
Restart=on-failure
RestartSec=3
