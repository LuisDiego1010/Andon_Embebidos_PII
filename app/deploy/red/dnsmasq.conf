# DHCP y nombre local para la red Wi-Fi de la estación → /etc/dnsmasq.conf
# Solo atiende wlan0; no reenvía consultas a Internet (la estación no tiene, REQ-N01).
interface=wlan0
# bind-dynamic: escucha cuando wlan0 tenga dirección (puede arrancar antes que hostapd)
# y no choca con systemd-resolved, que usa 127.0.0.53:53.
bind-dynamic
no-resolv
no-hosts
domain=lan
local=/lan/
address=/andon.lan/192.168.4.1

dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
# Puerta de enlace y DNS = la estación. Sin puerta de enlace, algunos celulares descartan la red.
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1
dhcp-authoritative
