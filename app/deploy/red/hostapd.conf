# Punto de acceso Wi-Fi propio de la estación (propuesta, Tablas 4, 7 y 8) → /etc/hostapd.conf
# El operario abre el formulario desde su celular conectado a esta red. Sin Internet (REQ-N01).
interface=wlan0
driver=nl80211
ssid=Andon-E1
# Costa Rica: canales 1–11 en 2,4 GHz
country_code=CR
ieee80211d=1
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Cambiar antes de la demo (mínimo 8 caracteres). El repositorio es público.
wpa_passphrase=andon-e1-demo
