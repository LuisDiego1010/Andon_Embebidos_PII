# Configuración de la estación Andon → /etc/andon/andon.conf
# Variables de entorno que la sobrescriben: ANDON_MODO, ANDON_MQTT_HOST,
# ANDON_MQTT_PUERTO, ANDON_OLLAMA_URL, ANDON_PARO_RUTA. Los umbrales se cambian sin reiniciar
# (cmd/recargar, CU-07).

[general]
# rpi = hardware real · sim = simulado (hal/sim.py)
# hibrido = sensores simulados (panel /simulador), LEDs, zumbador y OLED reales (D18)
modo = rpi
db_ruta = /var/lib/andon/andon.db
# Paro retenido: sobrevive a un reinicio del servicio o de la estación (CU-06)
paro_ruta = /var/lib/andon/paro.json

[mqtt]
host = 127.0.0.1
puerto = 1883

[ollama]
url = http://127.0.0.1:11434
modelo = tev1:0.8b
# RPi 4: ~17 s por consulta y ~38 s la carga en frío (D4)
timeout_s = 45
# Provisional (D4): recalibrar con más reportes
umbral_confianza = 0.92
# Consulta mínima al arrancar para cargar el modelo
calentar = true

[umbrales]
# PROVISIONALES: calibrar con el hardware (F2/F7)
vib_rms_g = 1.0
temp_c = 60.0

[sensores]
# D13: sin lectura válida del MPU-6050 o del DS18B20 durante este tiempo → paro retenido
tolerancia_fallo_s = 2.0

[gpio]
# Numeración BCM (libgpiod). Propuesta de docs/hardware.md; Diego confirma al cablear.
chip = /dev/gpiochip0
maquina = 17
verde = 22
amarilla = 27
roja = 23
zumbador = 24

[i2c]
bus = 1
mpu = 0x68
# Pantalla: ssd1306 (OLED 128x64, suele estar en 0x3C) o lcd1602 (LCD 16x2 con adaptador PCF8574,
# suele estar en 0x27). `oled` es la dirección de la pantalla, sea cual sea (D18).
pantalla = lcd1602
oled = 0x27

[web]
host = 0.0.0.0
puerto = 5000
# PIN de supervisor/administrador (D8). Cambiar antes de la demo.
pin = 1234
