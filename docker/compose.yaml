name: andon

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ollama:
    image: ollama/ollama:0.40.13   # misma versión que la receta ollama-bin de la imagen
    ports:
      - "11434:11434"
    volumes:
      - ollama-modelos:/root/.ollama

  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ..:/work
    environment:
      ANDON_MODO: sim
      ANDON_MQTT_HOST: mosquitto
      ANDON_OLLAMA_URL: http://ollama:11434
    depends_on:
      - mosquitto
      - ollama
    command: ["sleep", "infinity"]

volumes:
  ollama-modelos:
